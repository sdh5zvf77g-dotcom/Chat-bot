<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lumen</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lumen">
<meta name="theme-color" content="#0c1820">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#0c1820;--panel:#13242f;--line:#22394a;--ink:#e8f1ee;--dim:#8ba3ad;--amber:#ffb454;--amber-ink:#2a1a00;--me:#1b3646;--code:#08121a;--danger:#ff7a6b;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f1f5f2;--panel:#fff;--line:#d3dfdb;--ink:#0f2230;--dim:#5b7380;--amber:#c76a00;--amber-ink:#fff;--me:#dcebe8;--code:#e6eeeb;--danger:#c4382a;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding-top:var(--sat)}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
header h1{flex:1;margin:0;font-size:19px;font-weight:650;letter-spacing:.01em;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--ink);font-size:22px;display:grid;place-items:center}
.ib:active{background:var(--panel)}
.ib:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px 14px 8px;-webkit-overflow-scrolling:touch}
.msg{max-width:92%;margin:0 0 14px;padding:10px 14px;border-radius:18px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.user{margin-left:auto;background:var(--me);border-bottom-right-radius:6px;white-space:pre-wrap}
.msg.ai{background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:6px}
.msg.err{border-color:var(--danger);color:var(--danger)}
.msg p{margin:0 0 .6em}.msg p:last-child{margin:0}
.msg ul,.msg ol{margin:.2em 0 .6em;padding-left:1.3em}
.msg code{font:14px ui-monospace,Menlo,monospace;background:var(--code);padding:1px 5px;border-radius:5px}
.msg pre{margin:.5em 0;padding:10px 12px;background:var(--code);border-radius:10px;overflow-x:auto;font:13.5px/1.45 ui-monospace,Menlo,monospace}
.msg pre code{padding:0;background:none}
.tools{display:flex;gap:4px;margin-top:6px}
.tools button{border:0;background:none;color:var(--dim);font:14px inherit;padding:6px 8px;border-radius:8px;min-height:32px}
.cursor::after{content:"";display:inline-block;width:8px;height:8px;margin-left:4px;border-radius:50%;background:var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
#empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 20px 40px}
.orb{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 38% 34%,#ffe2ad,var(--amber) 45%,#b8530a 100%);box-shadow:0 0 70px 6px color-mix(in srgb,var(--amber) 45%,transparent);animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);box-shadow:0 0 90px 14px color-mix(in srgb,var(--amber) 55%,transparent)}}
#empty h2{font-size:28px;margin:28px 0 6px;font-weight:650}
#empty p{margin:0 0 22px;color:var(--dim);max-width:30ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:9px 15px;font:15px inherit}
.chip:active{border-color:var(--amber)}
footer{padding:8px 12px calc(8px + var(--sab));border-top:1px solid var(--line);background:var(--bg)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;max-height:140px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:22px;padding:11px 16px;font:17px/1.35 inherit;min-height:46px}
#send{width:46px;height:46px;border-radius:50%;border:0;background:var(--amber);color:var(--amber-ink);font-size:20px;font-weight:700;flex:none}
#send.stop{background:var(--danger);color:#fff}
#mic.on{color:var(--danger)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
.sheet.open{display:flex}
.card{width:100%;max-height:88%;overflow-y:auto;background:var(--panel);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + var(--sab))}
.card h3{margin:0 0 12px;font-size:20px}
label{display:block;margin:12px 0 4px;color:var(--dim);font-size:14px}
input,select,.card textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:11px 12px;font:16px inherit;min-height:44px;border-radius:12px}
.card textarea{min-height:90px;border-radius:12px}
.btn{margin-top:16px;width:100%;border:0;border-radius:14px;background:var(--amber);color:var(--amber-ink);font:650 17px inherit;padding:13px}
.btn.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin-top:8px}
.hint{font-size:13px;color:var(--dim);margin-top:6px}
.chat{display:flex;align-items:center;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--bg)}
.chat span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat.cur{border-color:var(--amber)}
.chat button{border:0;background:none;color:var(--dim);font-size:18px;min-width:36px;min-height:36px}
@media(prefers-reduced-motion:reduce){.orb,.cursor::after{animation:none}}
</style>
</head>
<body>
<header>
  <button class="ib" id="hist" aria-label="Chats">☰</button>
  <h1 id="title">Lumen</h1>
  <button class="ib" id="new" aria-label="New chat">✎</button>
  <button class="ib" id="gear" aria-label="Settings">⚙</button>
</header>
<main id="log" aria-live="polite"></main>
<footer>
  <div class="row">
    <button class="ib" id="mic" aria-label="Dictate">🎙</button>
    <textarea id="in" rows="1" placeholder="Ask anything" enterkeyhint="send"></textarea>
    <button id="send" aria-label="Send">↑</button>
  </div>
</footer>

<div class="sheet" id="setS"><div class="card">
  <h3>Settings</h3>
  <label for="prov">Provider</label>
  <select id="prov"><option value="anthropic">Anthropic (Claude)</option><option value="openai">OpenAI-compatible</option></select>
  <label for="key">API key</label>
  <input id="key" type="password" autocomplete="off" placeholder="Paste your key">
  <div class="hint">Stored only on this iPhone. Requests go straight from your phone to the provider.</div>
  <label for="model">Model</label>
  <input id="model" autocapitalize="off" autocorrect="off">
  <label for="base">Base URL (OpenAI-compatible only)</label>
  <input id="base" autocapitalize="off" autocorrect="off" placeholder="https://api.openai.com/v1">
  <label for="sys">Personality</label>
  <textarea id="sys"></textarea>
  <label for="theme">Theme</label>
  <select id="theme"><option value="auto">Match iPhone</option><option value="dark">Dark</option></select>
  <button class="btn" id="saveS">Save</button>
  <button class="btn alt" id="closeS">Close</button>
</div></div>

<div class="sheet" id="hisS"><div class="card">
  <h3>Chats</h3>
  <div id="list"></div>
  <button class="btn alt" id="closeH">Close</button>
</div></div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEF={prov:'anthropic',key:'',model:'claude-sonnet-5-5',base:'https://api.openai.com/v1',theme:'auto',
sys:'You are Lumen, a sharp, warm assistant on an iPhone. Lead with the answer. Keep replies short and easy to read on a small screen unless asked for more.'};
let cfg=Object.assign({},DEF,ls.get('lumen.cfg',{}));
let chats=ls.get('lumen.chats',[]);
let cur=ls.get('lumen.cur',null);
let ctrl=null,busy=false;

const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function md(t){
  const parts=t.split(/```/);
  return parts.map((p,i)=>{
    if(i%2){const nl=p.indexOf('\n');return '<pre><code>'+esc(nl>-1?p.slice(nl+1):p).replace(/\n$/,'')+'</code></pre>'}
    let h=esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<i>$2</i>');
    const out=[];let list=null;
    h.split('\n').forEach(l=>{
      let m;
      if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){if(list)out.push('</'+list+'>');out.push('<ul>');list='ul'}out.push('<li>'+m[1]+'</li>')}
      else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){if(list!=='ol'){if(list)out.push('</'+list+'>');out.push('<ol>');list='ol'}out.push('<li>'+m[1]+'</li>')}
      else{if(list){out.push('</'+list+'>');list=null}
        if(m=l.match(/^#{1,4}\s+(.*)/))out.push('<p><b>'+m[1]+'</b></p>');else if(l.trim())out.push('<p>'+l+'</p>')}
    });
    if(list)out.push('</'+list+'>');
    return out.join('');
  }).join('');
}

const chat=()=>chats.find(c=>c.id===cur);
const save=()=>{ls.set('lumen.chats',chats.slice(0,60));ls.set('lumen.cur',cur)};
function newChat(){const c={id:Date.now().toString(36),title:'New chat',msgs:[]};chats.unshift(c);cur=c.id;save();render()}
function applyTheme(){if(cfg.theme==='dark')document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme}

function render(){
  const c=chat();const log=$('log');log.innerHTML='';
  $('title').textContent=c&&c.msgs.length?c.title:'Lumen';
  if(!c||!c.msgs.length){
    log.innerHTML='<div id="empty"><div class="orb"></div><h2>What are you curious about?</h2><p>Ask a question, draft something, or talk it through.</p><div class="chips"></div></div>';
    ['Explain something simply','Plan my day','Help me write a message','Quiz me on a topic'].forEach(t=>{
      const b=document.createElement('button');b.className='chip';b.textContent=t;
      b.onclick=()=>{$('in').value=t+': ';$('in').focus()};log.querySelector('.chips').appendChild(b)});
    return;
  }
  c.msgs.forEach(m=>addBubble(m.role==='user'?'user':'ai',m.content));
  log.scrollTop=log.scrollHeight;
}
function addBubble(kind,text,extra){
  const d=document.createElement('div');d.className='msg '+kind+(extra?' '+extra:'');
  if(kind==='user')d.textContent=text;else{d.innerHTML=md(text);addTools(d,()=>text)}
  $('log').appendChild(d);return d;
}
function addTools(d,get){
  const t=document.createElement('div');t.className='tools';
  const cp=document.createElement('button');cp.textContent='Copy';
  cp.onclick=async()=>{try{await navigator.clipboard.writeText(get());cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1200)}catch(e){}};
  t.appendChild(cp);d.appendChild(t);
}
function setBusy(b){busy=b;const s=$('send');s.textContent=b?'■':'↑';s.classList.toggle('stop',b);s.setAttribute('aria-label',b?'Stop':'Send')}

async function* sse(res){
  const rd=res.body.getReader(),dec=new TextDecoder();let buf='';
  while(true){const {done,value}=await rd.read();if(done)break;
    buf+=dec.decode(value,{stream:true});const lines=buf.split('\n');buf=lines.pop();
    for(const l of lines){if(l.startsWith('data:')){const d=l.slice(5).trim();if(d&&d!=='[DONE]'){try{yield JSON.parse(d)}catch(e){}}}}}
}

async function send(){
  if(busy){ctrl&&ctrl.abort();return}
  const inp=$('in');const text=inp.value.trim();if(!text)return;
  if(!cfg.key){openSet();return}
  if(!chat())newChat();
  const c=chat();
  c.msgs.push({role:'user',content:text});
  if(c.msgs.length===1)c.title=text.slice(0,40);
  inp.value='';inp.style.height='auto';
  if(c.msgs.length===1)render();else addBubble('user',text);
  $('title').textContent=c.title;
  const bub=addBubble('ai','','cursor');$('log').scrollTop=$('log').scrollHeight;
  setBusy(true);ctrl=new AbortController();
  let acc='';
  try{
    let res;
    const msgs=c.msgs.map(m=>({role:m.role,content:m.content}));
    if(cfg.prov==='anthropic'){
      res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',signal:ctrl.signal,
        headers:{'content-type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:cfg.model,max_tokens:2048,stream:true,system:cfg.sys,messages:msgs})});
    }else{
      res=await fetch(cfg.base.replace(/\/$/,'')+'/chat/completions',{method:'POST',signal:ctrl.signal,
        headers:{'content-type':'application/json',authorization:'Bearer '+cfg.key},
        body:JSON.stringify({model:cfg.model,stream:true,messages:[{role:'system',content:cfg.sys},...msgs]})});
    }
    if(!res.ok){let m=await res.text();try{m=JSON.parse(m).error.message||m}catch(e){}throw new Error(res.status+': '+m)}
    for await(const ev of sse(res)){
      let piece='';
      if(cfg.prov==='anthropic'){if(ev.type==='content_block_delta'&&ev.delta&&ev.delta.text)piece=ev.delta.text}
      else piece=(ev.choices&&ev.choices[0]&&ev.choices[0].delta&&ev.choices[0].delta.content)||'';
      if(piece){acc+=piece;bub.innerHTML=md(acc);const lg=$('log');if(lg.scrollHeight-lg.scrollTop-lg.clientHeight<160)lg.scrollTop=lg.scrollHeight}
    }
  }catch(e){
    if(e.name!=='AbortError'){
      bub.classList.add('err');
      bub.textContent=(e.message==='Failed to fetch'?'Couldn’t reach the provider. Check your connection, key, and base URL.':e.message);
    }
  }
  bub.classList.remove('cursor');
  if(acc){c.msgs.push({role:'assistant',content:acc});bub.innerHTML=md(acc);addTools(bub,()=>acc)}
  else if(!bub.classList.contains('err')){bub.remove()}
  save();setBusy(false);ctrl=null;
}

function openSet(){
  $('prov').value=cfg.prov;$('key').value=cfg.key;$('model').value=cfg.model;$('base').value=cfg.base;$('sys').value=cfg.sys;$('theme').value=cfg.theme;
  $('setS').classList.add('open');
}
$('prov').onchange=()=>{ $('model').value=$('prov').value==='anthropic'?'claude-sonnet-5-5':'gpt-4o-mini' };
$('saveS').onclick=()=>{
  cfg={prov:$('prov').value,key:$('key').value.trim(),model:$('model').value.trim(),base:$('base').value.trim()||DEF.base,sys:$('sys').value,theme:$('theme').value};
  ls.set('lumen.cfg',cfg);applyTheme();$('setS').classList.remove('open');
};
$('closeS').onclick=()=>$('setS').classList.remove('open');
$('gear').onclick=openSet;

function openHist(){
  const l=$('list');l.innerHTML='';
  if(!chats.length)l.innerHTML='<p class="hint">No chats yet. Send a message to start one.</p>';
  chats.forEach(c=>{
    const d=document.createElement('div');d.className='chat'+(c.id===cur?' cur':'');
    const s=document.createElement('span');s.textContent=c.title;
    const x=document.createElement('button');x.textContent='✕';x.setAttribute('aria-label','Delete chat');
    s.onclick=()=>{cur=c.id;save();render();$('hisS').classList.remove('open')};
    x.onclick=()=>{chats=chats.filter(k=>k.id!==c.id);if(cur===c.id)cur=chats[0]?chats[0].id:null;save();render();openHist()};
    d.append(s,x);l.appendChild(d)});
  $('hisS').classList.add('open');
}
$('hist').onclick=openHist;$('closeH').onclick=()=>$('hisS').classList.remove('open');
$('new').onclick=()=>{if(busy)return;const c=chat();if(c&&!c.msgs.length)return;newChat()};

const inp=$('in');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px'});
$('send').onclick=send;

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=null;
$('mic').onclick=()=>{
  if(!SR){alert('Dictation isn’t available here. Use the microphone key on the iPhone keyboard instead.');return}
  if(rec){rec.stop();return}
  rec=new SR();rec.interimResults=true;rec.lang=navigator.language||'en-US';
  const base=inp.value;$('mic').classList.add('on');
  rec.onresult=e=>{let t='';for(const r of e.results)t+=r[0].transcript;inp.value=(base?base+' ':'')+t;inp.dispatchEvent(new Event('input'))};
  rec.onend=()=>{rec=null;$('mic').classList.remove('on')};rec.onerror=()=>{};rec.start();
};

applyTheme();
if(!chat())cur=chats[0]?chats[0].id:null;
render();
if(!cfg.key)setTimeout(openSet,400);
})();
</script>
</body>
</html>
